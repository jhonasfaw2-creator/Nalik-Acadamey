<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E2A033"/>
      <stop offset="100%" style="stop-color:#c4892a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="800" y2="300"/>
    <line x1="0" y1="150" x2="600" y2="450"/>
    <line x1="800" y1="0" x2="0" y2="450"/>
    <line x1="600" y1="0" x2="0" y2="300"/>
    <line x1="800" y1="150" x2="200" y2="450"/>
  </g>
  <!-- Color grading circles -->
  <circle cx="620" cy="180" r="120" fill="none" stroke="#E2A033" stroke-width="1.5" opacity="0.15"/>
  <circle cx="620" cy="180" r="80" fill="none" stroke="#E2A033" stroke-width="1" opacity="0.1"/>
  <circle cx="620" cy="180" r="40" fill="#E2A033" opacity="0.08"/>
  <!-- Timeline bar -->
  <rect x="80" y="320" width="640" height="4" rx="2" fill="white" opacity="0.08"/>
  <rect x="80" y="320" width="320" height="4" rx="2" fill="#E2A033" opacity="0.4"/>
  <!-- Playhead -->
  <rect x="398" y="308" width="2" height="28" fill="#E2A033" opacity="0.6"/>
  <circle cx="399" cy="308" r="4" fill="#E2A033" opacity="0.6"/>
  <!-- Text -->
  <text x="80" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E2A033" letter-spacing="3" opacity="0.8">DAVINCI RESOLVE</text>
  <text x="80" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" opacity="0.95">Color. Edit. Deliver.</text>
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="white" opacity="0.4">All-in-one post production</text>
  <!-- Corner accents -->
  <rect x="60" y="120" width="40" height="2" fill="#E2A033" opacity="0.5"/>
  <rect x="60" y="120" width="2" height="40" fill="#E2A033" opacity="0.5"/>
</svg>
